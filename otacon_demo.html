<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTACON // codec demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'VT323';
    src: local('VT323');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050906;
    --panel: #0c1512;
    --panel-edge: #16261f;
    --phosphor: #49ffa0;
    --phosphor-dim: #1f6b45;
    --phosphor-faint: #123322;
    --text: #b9f2cf;
    --amber: #ffb454;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .crt {
    width: 100%;
    max-width: 1500px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,0.6);
  }

  .scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(73,255,160,0.035) 0px,
      rgba(73,255,160,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 5;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 20px;
    border-bottom: 1px solid var(--phosphor-faint);
    gap: 16px;
  }

  .demo-tag-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .demo-sub {
    font-size: 10px;
    color: var(--phosphor-dim);
    text-align: right;
    max-width: 180px;
    line-height: 1.4;
  }

  .freq {
    font-family: 'VT323', monospace;
    font-size: 34px;
    color: var(--phosphor);
    letter-spacing: 2px;
  }

  .freq-label {
    font-size: 11px;
    color: var(--phosphor-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .demo-tag {
    font-size: 11px;
    color: var(--amber);
    letter-spacing: 2px;
    border: 1px solid var(--amber);
    padding: 3px 8px;
    border-radius: 2px;
  }

  .body {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 0;
  }

  .screen {
    min-height: 220px;
  }

  .call-incoming {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    min-height: 220px;
    padding: 20px;
  }

  .ring-icon {
    font-size: 20px;
    letter-spacing: 10px;
    color: var(--phosphor);
    animation: ring-pulse 1.4s ease-in-out infinite;
  }

  @keyframes ring-pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .call-label {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--phosphor-dim);
    text-transform: uppercase;
  }

  .answer-btn {
    background: transparent;
    border: 1px solid var(--phosphor);
    color: var(--phosphor);
    font-family: 'VT323', monospace;
    font-size: 22px;
    letter-spacing: 4px;
    padding: 8px 28px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .answer-btn:hover {
    background: var(--phosphor-faint);
  }

  .video-wrap {
    position: relative;
    background: #000;
  }

  .video-wrap video {
    display: block;
    width: 100%;
    height: auto;
  }

  .call-timer {
    position: absolute;
    top: 10px;
    right: 12px;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--phosphor);
    background: rgba(5,9,6,0.6);
    padding: 2px 8px;
    letter-spacing: 2px;
  }

  .replay-btn {
    align-self: flex-start;
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .replay-btn:hover {
    color: var(--phosphor);
    border-color: var(--phosphor);
  }

  .portrait-col {
    padding: 20px;
    border-right: 1px solid var(--phosphor-faint);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #avatar {
    width: 128px;
    height: 128px;
    image-rendering: pixelated;
  }

  .callsign {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--phosphor);
    letter-spacing: 2px;
  }

  .status {
    font-size: 10px;
    color: var(--phosphor-dim);
    letter-spacing: 1px;
    text-align: center;
  }

  .dialogue-col {
    padding: 20px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
  }

  .dialogue-box {
    flex: 1;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    min-height: 140px;
  }

  .dialogue-box .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--phosphor);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .prompts {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 16px 20px 20px;
    border-top: 1px solid var(--phosphor-faint);
  }

  .prompt-btn {
    background: transparent;
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 10px 8px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }

  .prompt-btn:hover {
    background: var(--phosphor-faint);
    border-color: var(--phosphor);
  }

  .prompt-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .prompt-btn-wide {
    grid-column: 1 / -1;
    text-align: center;
    border-color: var(--amber);
    color: var(--amber);
  }

  .prompt-btn-wide:hover {
    background: rgba(255,180,84,0.08);
    border-color: var(--amber);
  }

  .prompt-btn:disabled:hover {
    background: transparent;
    border-color: var(--phosphor-dim);
  }

  .footer-note {
    padding: 10px 20px 16px;
    font-size: 10px;
    color: var(--phosphor-dim);
    letter-spacing: 1px;
    text-align: center;
  }

  @media (max-width: 480px) {
    .body { grid-template-columns: 1fr; }
    .portrait-col { flex-direction: row; border-right: none; border-bottom: 1px solid var(--phosphor-faint); }
    #avatar { width: 72px; height: 72px; }
    .prompts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="crt">
  <div class="scanlines"></div>

  <div class="header">
    <div>
      <div class="freq">141.12</div>
      <div class="freq-label">incoming transmission</div>
    </div>
    <div class="demo-tag-wrap">
      <div class="demo-tag">DEMO MODE</div>
      <div class="demo-sub">Public portfolio demo. No private memory, email, files, or live system access.</div>
    </div>
  </div>

  <div class="screen" id="screen">

    <div class="call-incoming" id="callIncoming">
      <div class="ring-icon">&#9679;&#9679;&#9679;</div>
      <div class="call-label">incoming transmission</div>
      <button class="answer-btn" id="answerBtn">ANSWER</button>
    </div>

    <div class="video-wrap" id="videoWrap" style="display:none;">
      <video id="demoVideo" playsinline>
        <source src="otacon-demo.mp4" type="video/mp4">
      </video>
      <div class="call-timer" id="callTimer">00:00</div>
    </div>

    <div class="body" id="interactiveBody" style="display:none;">
      <div class="portrait-col">
        <canvas id="avatar" width="16" height="16"></canvas>
        <div class="callsign">OTACON</div>
        <div class="status" id="status">standing by</div>
      </div>

      <div class="dialogue-col">
        <div class="dialogue-box" id="dialogue">Recording's over \u2014 pick a frequency below.<span class="cursor"></span></div>
        <button class="replay-btn" id="replayBtn">&#8634; REPLAY TRANSMISSION</button>
      </div>
    </div>

  </div>

  <div class="prompts" id="prompts" style="display:none;">
    <button class="prompt-btn" data-key="identity">WHO ARE YOU?</button>
    <button class="prompt-btn" data-key="capabilities">WHAT CAN YOU DO?</button>
    <button class="prompt-btn" data-key="architecture">ARCHITECTURE</button>
    <button class="prompt-btn" data-key="roadmap">WHAT'S NEXT?</button>
    <button class="prompt-btn prompt-btn-wide" data-key="whymatters">WHY THIS PROJECT MATTERS</button>
  </div>

  <div class="footer-note" id="footerNote" style="display:none;">no live model &middot; no data stored &middot; scripted responses only</div>
</div>

<script>
  const RESPONSES = {
    identity: "HAL is the assistant \u2014 a personal AI project I designed and built independently. Otacon is this demo's persona and interface. Think digital chief of staff, not chatbot: persistent memory, multi-channel access, and real task execution, with safety rails built in from day one.",
    capabilities: "I remember context across conversations, read inbox context to prep replies, and generate documents on request \u2014 PDF, Word, plain text. What I can't do yet is read a document back once it's created; that wiring is next. All from one backend brain, reachable through chat, voice, or web.",
    architecture: "One core function handles every request. Discord, web, and voice are just doorways \u2014 thin adapters that call the same brain and get back a reply, an emotional state, and any generated document. New interfaces plug in without touching the logic underneath.",
    roadmap: "Shipped: Discord bot core, persistent memory, Claude-backed reasoning, a codec-style web interface, and Gmail-aware inbox reading. Document generation \u2014 PDF, Word, plain text \u2014 works standalone; wiring it into live chat replies is next. After that: voice mode, a fully offline local model, and expanding into an always-on home assistant setup.",
    whymatters: "This project is a working demonstration of API integration, system design, persistent memory architecture, OAuth-based third-party access, and a clean split between a private production system and a public-facing one \u2014 the same separation of concerns that matters in any real vendor integration."
  };

  const answerBtn = document.getElementById('answerBtn');
  const callIncoming = document.getElementById('callIncoming');
  const videoWrap = document.getElementById('videoWrap');
  const demoVideo = document.getElementById('demoVideo');
  const callTimer = document.getElementById('callTimer');
  const interactiveBody = document.getElementById('interactiveBody');
  const prompts = document.getElementById('prompts');
  const footerNote = document.getElementById('footerNote');

  let timerInterval;

  answerBtn.addEventListener('click', () => {
    callIncoming.style.display = 'none';
    videoWrap.style.display = 'block';
    demoVideo.play();

    let elapsed = 0;
    timerInterval = setInterval(() => {
      elapsed++;
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      callTimer.textContent = `${m}:${s}`;
    }, 1000);
  });

  demoVideo.addEventListener('ended', () => {
    clearInterval(timerInterval);
    videoWrap.style.display = 'none';
    interactiveBody.style.display = 'grid';
    prompts.style.display = 'grid';
    footerNote.style.display = 'block';
  });

  const replayBtn = document.getElementById('replayBtn');
  replayBtn.addEventListener('click', () => {
    interactiveBody.style.display = 'none';
    prompts.style.display = 'none';
    footerNote.style.display = 'none';
    videoWrap.style.display = 'block';
    demoVideo.currentTime = 0;
    demoVideo.play();

    let elapsed = 0;
    callTimer.textContent = '00:00';
    timerInterval = setInterval(() => {
      elapsed++;
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      callTimer.textContent = `${m}:${s}`;
    }, 1000);
  });

  const dialogue = document.getElementById('dialogue');
  const statusEl = document.getElementById('status');
  const buttons = document.querySelectorAll('.prompt-btn');
  let typing = false;

  function typeText(text) {
    if (typing) return;
    typing = true;
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = 'receiving...';
    dialogue.innerHTML = '';
    let i = 0;
    const speed = 16;
    function step() {
      if (i <= text.length) {
        dialogue.innerHTML = text.slice(0, i) + '<span class="cursor"></span>';
        i++;
        setTimeout(step, speed);
      } else {
        typing = false;
        buttons.forEach(b => b.disabled = false);
        statusEl.textContent = 'standing by';
      }
    }
    step();
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      typeText(RESPONSES[btn.dataset.key]);
    });
  });

  // pixel avatar — simple idle face, drawn on a 16x16 canvas, scaled up crisp
  const ctx = document.getElementById('avatar').getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const PHOSPHOR = '#49ffa0';
  const DIM = '#123322';

  const FACE = [
    "0000111111000000",
    "0011111111110000",
    "0111111111111000",
    "0111022202220111",
    "1110222022201110",
    "1110222022201111",
    "1111022202221111",
    "1111111111111111",
    "1111100000011111",
    "1111111111111111",
    "0111111111111100",
    "0011111111110000",
    "0000111111000000",
    "0000000000000000",
    "0000000000000000",
    "0000000000000000"
  ];

  function drawFace(blink) {
    ctx.clearRect(0, 0, 16, 16);
    for (let y = 0; y < 16; y++) {
      for (let x = 0; x < 16; x++) {
        const cell = FACE[y][x];
        if (cell === '1') {
          ctx.fillStyle = DIM;
          ctx.fillRect(x, y, 1, 1);
        } else if (cell === '2' && !blink) {
          ctx.fillStyle = PHOSPHOR;
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
  }

  drawFace(false);
  setInterval(() => {
    drawFace(true);
    setTimeout(() => drawFace(false), 120);
  }, 3200);
</script>

</body>
</html>
